services:
  django:
    build: .
    command: uv run python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - .:/app
      - venv:/app/.venv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    command: uv run python start_bot.py
    env_file:
      - .env
    volumes:
      - .:/app
      - venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      OLLAMA_API_URL: http://ollama:11434

  db:
    image: pgvector/pgvector:pg18
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DBNAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    ports:
      - "${PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER} -d ${DBNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: user@domain.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.17.4
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  pg_data:
  ollama:
  venv: